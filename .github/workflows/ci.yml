name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jmm_launch_integration_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d jmm_launch_integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:55432/jmm_launch_integration_test
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:55432/jmm_launch_integration_test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3220
      TEST_BASE_URL: http://127.0.0.1:3220
      JMM_INTEGRATION_BASE: http://127.0.0.1:3220
      JMM_EGRESS_LOG: /tmp/jmm-egress.log
      PORT: 3220
      NEXT_TELEMETRY_DISABLED: "1"
      ENABLE_INTERVALS_CONNECTOR: "false"
      ENABLE_AUTOMATED_DELIVERY: "false"
      ENABLE_MOCK_COACHING: "false"
      COACHING_TRANSPORT: mock
      TOKEN_ENCRYPTION_KEY: isolated-ci-token-key
      CRON_SECRET: isolated-ci-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test schema and client
        run: npm run db:deploy && npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Crypto roundtrip (token encryption)
        run: TOKEN_ENCRYPTION_KEY=ci-test-key npx tsx scripts/crypto-check.ts

      - name: Unit and provider contract tests
        run: npm test

      - name: Follow-up boundaries and injected Telegram transport
        run: npm run test:followup:boundaries

      - name: Database sync and reminder tests
        run: npm run test:sync

      - name: Production build
        run: npm run build

      - name: Authenticated integration tests
        env:
          ENABLE_MOCK_COACHING: "true"
        run: |
          NODE_OPTIONS="--require ./scripts/jmm-test-egress-guard.cjs" ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3220 > /tmp/jasmethod-server.log 2>&1 &
          echo $! > /tmp/jmm-ci-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3220/api/auth/me && break; sleep 1; done
          npm run test:integration

      - name: Device-free launch acceptance and decoded FIT semantics
        run: npm run test:launch

      - name: Explicit sport files, target tracking and opt-in coaching acceptance
        env:
          ENABLE_MOCK_COACHING: "true"
        run: npm run test:followup

      - name: Native Telegram webhook acceptance with dummy config and no provider traffic
        run: |
          kill "$(cat /tmp/jmm-ci-server.pid)"
          for i in $(seq 1 30); do
            code=$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3220/api/today || true)
            [ "$code" = "000" ] && break
            sleep 1
          done
          export ENABLE_MOCK_COACHING=false ENABLE_TELEGRAM_COACHING=true ENABLE_AUTOMATED_DELIVERY=true COACHING_TRANSPORT=telegram
          export TELEGRAM_BOT_TOKEN=SYNTHETIC_NOT_A_VALID_BOT_TOKEN TELEGRAM_COACHING_WEBHOOK_SECRET=SYNTHETIC_LOCAL_WEBHOOK_SECRET
          export NODE_OPTIONS="--require ./scripts/jmm-test-egress-guard.cjs"
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3220 > /tmp/jmm-telegram-server.log 2>&1 &
          echo $! > /tmp/jmm-ci-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3220/api/auth/me && break; sleep 1; done
          npm run test:telegram

      - name: Save synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmm-launch-acceptance
          path: |
            .local/jmm-launch-integration/report.json
            .local/jmm-launch-integration/*.fit
            .local/jmm-launch-integration/*-decoded.json
            .local/jmm-followup-integration/report.json
            .local/jmm-followup-integration/*.fit
            .local/jmm-followup-integration/*.zip
            .local/jmm-followup-integration/*-decoded.json
            .local/jmm-telegram-webhook-integration/report.json
          if-no-files-found: ignore
