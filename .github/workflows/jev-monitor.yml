# Jev web error monitor — JasMiamiMethod
# Runs the route auditor (TypeSafe AI System-1) on a schedule, on pushes to
# main/master, and on demand. Alerts via Resend email and/or generic webhook.
name: Jev Error Monitor

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  BASE_URL: ${{ vars.BASE_URL || 'https://jasmiamimethod.fit' }}

jobs:
  jev-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run Jev audit (jev-latest, heuristic fallback without key)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_DEFAULT_MODEL: ${{ vars.TYPESAFE_DEFAULT_MODEL || 'jev-latest' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          BASE_URL: ${{ env.BASE_URL }}
        run: node scripts/jev-audit.mjs
      - name: Alert summary
        if: failure()
        run: echo "Jev found unhealthy routes — see the audit log above. Notifications were dispatched if Resend/webhook secrets are configured."
